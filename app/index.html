     bookmark. Its start_url and scope are "./", beside this page, so it works at the site root and in a
     subfolder. use-credentials: if the site sits behind a login (e.g. Cloudflare Access), a manifest
     fetched without the login cookie would be sent to the login page instead. -->

<div class="phone" id="phone">
  <!-- 开屏: splash.css; shown by the hook after applyLook(), once per visit -->
  <div class="splash" id="splash" hidden><img class="splash-mark" src="brand/modu-mark.svg" alt=""><img class="splash-word" src="brand/modu-wordmark.svg" alt="Modu"></div>
  <div class="wp"><div class="wp-img" id="wpImg"></div></div>
  <div class="island" id="island"></div>
  <div class="status"><span id="sbTime">00:00</span><span class="sig"><svg class="ic"><use href="#i-signal"/></svg><svg class="ic"><use href="#i-battery"/></svg></span></div>

  <!-- 锁屏: the time, his presence strip (from the body seam), his last line -->
  <section class="screen on-wall" id="s-lock" hidden>
    <div class="pad-top"></div>
    <div class="lk" id="lk">
      <div class="presence" id="presence" data-state="here"><span class="av xs" data-av></span><span id="presenceText"></span><span class="pdot"></span></div>
      <div class="lk-date" id="lkDate"></div>
      <div class="lk-time" id="lkTime">00:00</div>
      <div class="lk-note" id="lkNote"><div class="av sm" data-av></div><div class="lk-body"><div class="lk-top"><b data-name></b><small id="lkWhen"></small></div><p id="lkLine"></p></div></div>
      <div class="lk-hint" data-t="lock.hint"></div>
      <div class="lk-bar"></div>
    </div>
    <!-- 锁屏密码 (lock.js): opens after a tap or swipe when the passcode is on -->
    <div class="lk-code" id="lkCode" hidden>
      <div class="lk-ask" id="lkAsk"></div>
      <div class="lk-dots" id="lkDots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="lk-keys" id="lkKeys">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <span></span><button data-k="0">0</button><button class="k-del" data-k="del" data-t="delete"></button>
      </div>
      <div class="lk-first" id="lkFirst" data-t="lock.code.first"></div>
      <!-- 忘记密码, once she has a code of her own (the first code is shown above until then) -->
      <div class="lk-links"><button class="link" id="lkForgot" data-t="lock.forgot" hidden></button><button class="link" id="lkCancel" data-t="cancel"></button></div>
    </div>
  </section>

  <!-- 搬家 -->
  <section class="screen" id="s-import" hidden>
    <div class="pad-top"></div>
    <div class="imp">
      <button class="back imp-back" id="impBack" data-go="chats" data-ta="chats.title" hidden><svg class="ic"><use href="#i-back"/></svg></button>
      <div class="brand"><img src="brand/modu-lockup.svg" alt="Modu" onerror="this.parentNode.hidden = true"></div>
      <h1 data-t="import.title"></h1>
      <p class="lead" data-t="import.lead"></p>
      <label class="drop" id="drop">
        <svg class="ic"><use href="#i-box"/></svg><div id="dropMain"></div><small id="dropSub"></small>
        <input type="file" id="files" multiple hidden>
      </label>
      <!-- a tap on c.ai or 酒馆 shows that place's steps in the note under the chips -->
      <div class="src"><span data-t="import.source.cai" data-src="cai" role="button" tabindex="0" aria-pressed="true"></span><span data-t="import.source.st" data-src="st" role="button" tabindex="0" aria-pressed="false"></span><span class="dim" data-t="import.source.gpt"></span><span class="dim" data-t="import.source.ds"></span></div>
      <div class="note" id="impHow" data-t="import.caiapp.how"></div>
      <div class="note" id="impNote"></div>
      <!-- the c.ai app's export has many chats and no names on them: she picks the chat and who he is -->
      <div class="caipick" id="caiPick" hidden>
        <div class="gtitle" id="caiChatsT" data-t="import.caiapp.chats"></div>
        <div class="picks" id="caiChats"></div>
        <div class="gtitle" data-t="import.caiapp.who"></div>
        <div class="picks row" id="caiWho"></div>
        <input type="text" class="cainame" id="caiName" data-tp="import.caiapp.who.type" enterkeyhint="done" autocomplete="off">
        <div class="gtitle" id="caiPicsT" data-t="import.caiapp.pic"></div>
        <div class="picks row" id="caiPics"></div>
      </div>
      <!-- his pronoun, asked once when the card does not say -->
      <div class="caipick" id="pronPick" hidden>
        <div class="gtitle" id="pronAsk"></div>
        <div class="picks row" id="pronBtns"></div>
        <div class="note" id="pronFoot"></div>
      </div>
      <!-- a Modu backup picked here opens as 导入备份 does; two cards or two chats in one pick: she says which -->
      <button class="link" id="impBackup" hidden data-t="import.backup.go"></button>
      <div class="caipick" id="manyPick" hidden><div class="gtitle" id="manyAsk"></div><div class="picks" id="manyBtns"></div></div>
      <input type="text" class="cainame" id="impName" data-tp="import.name.type" enterkeyhint="done" autocomplete="off" hidden>
      <div class="spacer"></div>
      <div class="contact" id="card" hidden><div class="av" id="cardAv"></div><div><b id="cardName"></b><small id="cardCount"></small><small id="cardFrom"></small></div></div>
      <button class="link" id="caiSwap" hidden data-t="import.caiapp.swap"></button>
      <button class="btn" id="start" hidden data-t="import.start"></button>
      <button class="link" id="openOld" data-t="import.open"></button>
    </div>
  </section>

  <!-- 桌面: two pages and the dock -->
  <section class="screen on-wall" id="s-home" hidden>
    <div class="pad-top"></div>
    <div class="wall" id="wall">
      <div class="pages" id="pages">
        <div class="page">
          <div class="w big"><div><div class="greet" id="greet"></div><div class="clock" id="clock">00:00</div><div class="sub" id="date"></div></div><div class="wx"><svg class="ic"><use id="wxIcon" href="#i-sun"/></svg><span id="homePresence"></span></div></div>
          <button class="w him glass wide" data-go="chat"><div class="av" data-av></div><div class="hbody"><div class="htop"><b data-name></b><small class="t" id="lastTime"></small></div><small id="lastLine"></small><span class="days" id="days"></span></div></button>
          <div class="wrow wmix">

<script>
// The page starts only once the files it cannot start without have arrived (a server busy or restarting would
// otherwise leave a blank page). If one is missing, the page reloads itself ONCE: only when this tab can keep a
// mark (sessionStorage) and had none; a good start takes the mark off. With no storage, or after that one reload,
// one plain line says so, with a button to try again: never a loop of reloads. The others (life, scheduler, voice,
// kaomoji, backup) are optional: the page runs without them.
(function(){
  const KEY = 'modu-boot-retry', missing = ['ModuCore', 'ModuDrafts', 'ModuLock', 'ModuApps', 'ModuLook'].filter(k => !window[k]);
  if (!missing.length){ try { sessionStorage.removeItem(KEY); } catch {} return; }
  window.ModuBootFailed = missing;
  let had = true, kept = false;
  try { had = sessionStorage.getItem(KEY) === '1'; sessionStorage.setItem(KEY, '1'); kept = sessionStorage.getItem(KEY) === '1'; } catch {}
  if (kept && !had) { location.reload(); return; }
  // the words file is read by the page itself, which did not start: the line is written here (as app.peek.toast.fail says it)
  const box = document.createElement('div'); box.id = 'bootFail'; box.setAttribute('role', 'alert');
  // top/left/right/bottom, not `inset` (Chrome 87): an old engine must still see this line
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f6f3ef;color:#333;font:16px/1.5 system-ui,sans-serif;z-index:99999';
  const line = document.createElement('div'); line.textContent = '没打开，可以再试一次';
  const again = document.createElement('button'); again.textContent = '再试一次'; again.style.cssText = 'font:inherit;padding:8px 20px;border-radius:18px;border:1px solid #bbb;background:#fff';
  again.onclick = () => { try { sessionStorage.removeItem('modu-boot-retry'); } catch {} location.reload(); };
  box.append(line, again); document.body.appendChild(box);
})();
</script>

const A = window.ModuApps;
// 草稿: what she typed and has not sent yet, kept per companion and per box (drafts.js)
const D = window.ModuDrafts;

// kept on this device (localStorage modu-dev); ?dev=1 / ?dev=0 for one visit. With it on, every element
// marked data-dev shows: 本机 (the local model server), 设置 → 高级 with the face page, the VRM file in 身体, the call's note.
let DEV = qs.has('dev') ? qs.get('dev') === '1' : (() => { try { return localStorage.getItem('modu-dev') === '1'; } catch { return false; } })();

function holdBeta(){ if (A && A.hold) for (const id of BETA_APPS) A.hold(id, !DEV); }
// Where a new companion's folder goes: a folder she picks (computer Chrome / Edge), or this browser's

let WORDS = {};
// a busy phone or server can drop the request once (a refused words.txt leaves raw keys on every screen),
// and an error page is not words: asked up to three times before going on without
async function loadWords(){
  for (let n = 1; n <= 3; n++){
    try {
      const r = await fetch('words.txt', { cache:'no-cache' });
      if (!r.ok) throw new Error('words.txt: ' + r.status);
      const t = await r.text();
      for (const line of t.split(/\r?\n/)){
        if (!line.trim() || line.trim().startsWith('#')) continue;
        const i = line.indexOf('='); if (i < 0) continue;
        WORDS[line.slice(0, i).trim()] = line.slice(i + 1).trim().replace(/\\n/g, '\n');
      }
      return;
    } catch { if (n < 3) await new Promise(r => setTimeout(r, 400 * n)); }
  }
}
// the words say 他 for him; when his pronoun is 她 or TA (pronouns.json, or her answer in 搬家 before he is

function heWord(){
  let p = '';
  try {
    if (current === 'import' && staged && staged.card){ const x = staged.card.extensions && staged.card.extensions.modu; p = staged.pronoun ? staged.pronoun.pronouns : (x && x.pronouns) || ''; }
    else if (S.name) p = M.pronouns().raw;
  } catch {}
  return /^she/i.test(p) ? '她' : /^they/i.test(p) ? 'TA' : '他';
}
function T(key, vars){
  let s = key in WORDS ? WORDS[key] : key;
  if (s.includes('他') && !/\.pronoun\.(he|she|they)$/.test(key)){ const h = heWord(); if (h !== '他') s = s.replace(/(其)?他/g, (m, q) => q ? m : h); }

// Where she came from. The way she came is the page's own history: one entry per step forward, pushed as she
// taps (stack[i] = the address at history depth i, depth = where she is; each entry's state is { moduBack: i, addr }). A
// back button on a screen is an "up" step, never a step forward: a back that says home (设置, 记忆, 聊天, 美化, 声音, 身体,
// every app's) goes one entry back, so 设置 → 记忆 → back is 设置 and 聊天 → ⋯ → 记忆 → back is the chat; a back that names a
// screen (the chat's 聊天) goes back to it if it is on the way, else takes the place of the screen she leaves. Android's back
// (and a browser's) moves through the same entries (popstate), so it always agrees, and nothing is ever pushed from popstate.
// Coming to a screen already on the way goes back to it (no loops; hanging up goes back to the chat under the call); home is
// the start of every way; the lock screen and 搬家 take the place of the one they cover. Above the screen's own entry there
// may be small steps that are not screens (`extra`): an open sheet, an app's inner view (ctx.inner); the system back undoes
// the top one only (closes the sheet, leaves the letter), and they are taken away when she leaves the screen.
let stack = [], depth = 0, booted = false, extra = [];   // extra: [{ undo, pushed }], oldest first
let popping = false, landDepth = 0, landTimer = 0, landTries = 0;
const baseOf = a => String(a || '').split('@')[0];
function hist(kind, addr){
  // while a move back of the page's own is on its way, the way is written here only; history is brought up to it when the
  // move lands (finish): pushed at once, an entry would be under the move back, and the move could leave the page
  const url = location.pathname + location.search + '#' + addr;
  // (the address bar shows the screen at once all the same: only the URL of the entry it stands on now, its state kept)
  if (popping){ if (kind === 'push'){ depth++; stack.length = depth; } stack[depth] = addr; try { history.replaceState(history.state, '', url); } catch {} return; }
  try {
    if (kind === 'push'){ depth++; stack.length = depth; history.pushState({ moduBack: depth, addr }, '', url); }
    else history.replaceState({ moduBack: depth, addr }, '', url);
    stack[depth] = addr;
  } catch {}
}
// Where history really stands: the depth in the entry's state, plus its place among the extra steps above the screen
function physNow(){ const st = history.state; return st && typeof st.moduBack === 'number' ? st.moduBack + (st.extra || 0) : null; }
const pushedExtras = () => extra.filter(x => x.pushed).length;
// Bring history to the page's way (the page shows it already): back to landDepth plus the extra steps still standing. Only
// ever one move on its way: a browser may drop a move asked for while another is still going, or take its time. A move goes
// on from where a popstate shows history has landed; a moment without one only looks again (history.state) and waits.
function stepBack(){
  landDepth = popping ? Math.min(landDepth, depth) : depth;
  if (popping) return;
  const at = physNow(), want = landDepth + pushedExtras();
  if (at != null && at > want) moveBack(at - want); else finish();
}
function moveBack(n){ popping = true; landTries = 0; armLand(); try { history.go(-n); } catch { finish(); } }
// (after 10 s with history still where it was, the move was lost, not slow: it is asked for once more)
function armLand(){
  clearTimeout(landTimer);
  landTimer = setTimeout(() => {
    const at = physNow(), want = landDepth + pushedExtras();
    if (at == null || at <= want) landedAt(); else if (++landTries >= 20) moveBack(at - want); else armLand();
  }, 500);
}
function landedAt(){   // a popstate while a move was on its way: where it has landed
  const at = physNow(), want = landDepth + pushedExtras();
  if (at != null && at > want){ clearTimeout(landTimer); moveBack(at - want); return; }
  if (at != null && at < want){ for (const x of extra) x.pushed = false; landDepth = Math.min(landDepth, Math.max(0, at)); }   // went further (her own back too)
  finish();
}
function finish(){
  clearTimeout(landTimer); popping = false;
  if (!pushedExtras()){   // standing on the screen's own entry: its address, then the steps she took forward meanwhile
    const later = stack.slice(landDepth + 1, depth + 1); depth = landDepth;
    hist('replace', stack[depth] || current);
    for (const a of later) hist('push', a);
  }
  extra.forEach((x, i) => { if (!x.pushed) try { history.pushState({ moduBack: depth, addr: stack[depth], extra: i + 1 }, '', location.href); x.pushed = true; } catch {} });
}
function cutTo(i){ extra = []; depth = Math.min(depth, i); stack.length = depth + 1; stepBack(); }
// an extra step (a sheet, an app's inner view): pushed now, or when a move on its way has landed
function pushExtra(undo){
  if (!booted) return false;
  const x = { undo, pushed: false }; extra.push(x);
  if (!popping) try { history.pushState({ moduBack: depth, addr: stack[depth], extra: extra.length }, '', location.href); x.pushed = true; } catch {}
  return true;
}
// an extra step taken away wherever it stands: the ones above it are put back after it (finish)
function dropExtraAt(i){
  if (i < 0 || i >= extra.length) return;
  const moved = extra.slice(i).some(x => x.pushed);
  for (const x of extra.slice(i + 1)) x.pushed = false;
  extra.splice(i, 1);
  if (moved) stepBack();
}
const lastExtra = test => { for (let i = extra.length - 1; i >= 0; i--) if (test(extra[i])) return i; return -1; };
// ctx.inner(on, undo): an app says, each time it draws, whether it stands in an inner view (外卖's 东西, an open letter);
// going in adds one entry (the system back calls undo, which brings the app back to its first view), coming out by
// itself takes the entry away
function innerStep(on, undo){
  const i = lastExtra(x => x.inner);
  if (on && i < 0){ pushExtra(() => undo()); extra[extra.length - 1].inner = true; }
  else if (!on && i >= 0) dropExtraAt(i);
}
function below(name){ for (let i = depth - 1; i >= 0; i--) if (baseOf(stack[i]) === name) return i; return -1; }
function navStep(from, name, addr, opts){
  if (opts.nav === 'pop'){ if (stack[depth] !== addr) hist('replace', addr); return; }   // history has moved already
  // the first screen of this load: an entry an earlier load of this tab left (a reload) is used again, never one more pushed
  if (!booted){ booted = true; const st = history.state; depth = st && typeof st.moduBack === 'number' ? st.moduBack : 0; stack = []; hist('replace', addr); return; }
  if (extra.length){ extra = []; stepBack(); }   // a sheet or an app's inner step on top goes with the screen she leaves
  if (name === 'home'){ stack[0] = addr; if (depth > 0) cutTo(0); else hist('replace', addr); return; }
  // the page let go of the screen first (switching person in an app, a call from 通话): the same app for someone else takes its place
  if (!from && baseOf(stack[depth]) === name){ hist('replace', addr); return; }
  if (opts.nav === 'replace' || name === 'lock' || from === 'lock' || from === name){ hist('replace', addr); return; }
  const i = below(name); if (i >= 0){ stack[i] = addr; cutTo(i); return; }
  if (from === 'import' || from === 'call'){ hist('replace', addr); return; }
  hist('push', addr);
}
// a back button on a screen (data-go names where it leads when there is no way back), and an app's ctx.back(). The page
// shows the screen at once and lets history follow (stepBack), so a tap that comes before history has moved is not lost
const usable = a => a && (S.name || ['chats', 'home'].includes(baseOf(a)));   // his screens are gone with him
function barBack(to = 'home'){
  let i = to === 'home' ? depth - 1 : below(to);
  if (to === 'home') while (i >= 0 && stack[i] && !usable(stack[i])) i--;
  if (i < 0){ go(to, { nav: 'replace' }); return; }
  if (!stack[i] && !popping){ history.go(i - depth - pushedExtras()); return; }   // an entry an earlier load left: history knows where it leads
  const addr = stack[i] || 'home'; cutTo(i); go(addr, { nav: 'pop' });
}
addEventListener('popstate', e => {
  if (popping){ landedAt(); return; }
  const k = lastExtra(x => x.pushed);
  if (k >= 0){ const [x] = extra.splice(k, 1); try { x.undo(); } catch(err){ console.error(err); } return; }   // a sheet, an app's inner step
  const st = e.state && typeof e.state.moduBack === 'number' ? e.state : null;
  const d = st ? st.moduBack : 0, addr = st ? st.addr : (location.hash.slice(1) || 'home');
  depth = d; stack.length = d + 1; stack[d] = addr; extra = [];
  if ($('scrim').classList.contains('open')) closeSheet();
  if (current === 'lock'){ lockTarget = addr; return; }   // locked: the keypad stays; behind it she has stepped back
  if (!usable(addr)){ if (d > 0) history.back(); else go('home'); return; }
  go(addr, { nav: 'pop' });
});
function go(name, opts = {}){

  // what she asked for, so a reload comes back to the same page

  if (held){ if (current !== 'soon') soonFrom = current && current !== 'lock' ? (location.hash.slice(1) || current) : 'home'; soonKey = held; name = 'soon'; }

  const route = /^app:([a-z][a-z0-9-]*)(?:@([A-Za-z0-9_-]+))?$/.exec(name);
  if (route){

// ---------- app sessions and contact-scoped apps ----------
// ctx.session.begin({ title }) → s: s.turn(told, opts) (the core's turn, his words never into the chat),
// s.log({ who, what, line, title?, detail? }) (= logEvent with this session's id), s.hold(line) (what his chat
// turns see while it is open: the activity block), s.end({ card }) (closes it; card { line (or mes), id?,
// type?, title? } adds one neutral grey line to the chat). The page ends every session a mount began
// when the app is closed, whichever way she leaves (back, home bar, switching person), so the
// app's own unmount may call s.end({ card }) first and nothing is ever left open.
let appOpts = { action:'', from:'' };
const appSessions = new Map();   // app id → Set of the sessions its mount began
function newSession(appId, o = {}, key = appId){   // key: whose set it is in (the call screen's call is not the 通话 app's mount)
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title = String(o.title || '').slice(0, 20);
  const set = appSessions.get(key) || new Set(); appSessions.set(key, set);
  let open = true, ended = null;
  const ready = (async () => await M.beginSession({ app: appId, title, id }))().catch(e => { console.error(e); return null; });
  const s = {
    id, app: appId, title, contact: M.currentId || '', ready,
    get open(){ return open; },
    turn: async (told, opts) => await M.turn(told, opts),
    async log(e = {}){ await ready; return await M.logEvent(Object.assign({ title: title || undefined }, e, { app: appId, session: id })); },
    async hold(line){ await ready; return open ? await M.holdSession(id, line) : null; },
    end(eo = {}){
      if (ended) return ended;
      open = false; set.delete(s);
      ended = (async () => { await ready; return await M.endSession(id, { card: (eo && eo.card) || null }); })().catch(e => { console.error(e); return { session:null, card:null }; });
      return ended;
    },
  };
  set.add(s);
  return s;
}
function mountApp(app){
  closeApp(app.id);
  const el = appScreen(app.id), ctx = Object.assign(appCtx(), {
    session: { begin: o => newSession(app.id, o) },
    action: String(appOpts.action || ''), from: String(appOpts.from || ''),
    withChip: () => withChip(app),
  });
  A.open(app.id, el, ctx);
  // a contact-scoped app's header shows his face and 和 <name>; a tap switches person (ending the session first)
  if (app.scope === 'contact' && !el.querySelector('[data-with]')){ const bar = el.querySelector('.bar'); if (bar) bar.insertAdjacentHTML('beforeend', withChip(app)); }
}
// → a Promise that settles when every session of that mount has ended (its card, if any, is in the chat)
function closeApp(id){
  const set = appSessions.get(id), all = set ? [...set] : [];
  A.close(id);   // the app's own unmount runs first, so it can end its session with a card
  appSessions.delete(id);
  return Promise.all(all.map(s => s.end()));
}
function withChip(app){
  const c = contactNow(); if (!c) return '';
  return `<button class="withchip" type="button" data-with="${esc(app.id)}" aria-label="${esc(T('apps.with.switch'))}"><span class="av xs"${c.avatar ? ` style="background-image:url(&quot;${esc(c.avatar)}&quot;)"` : ''}></span><span class="wn">${esc(T('apps.with', { name: c.name }))}</span></button>`;

  // 添加联系人: always the first row; it opens 搬家
  const add = document.createElement('button'); add.className = 'citem add'; add.id = 'addRow';
  add.innerHTML = `<div class="av"><svg class="ic"><use href="#i-plus"/></svg></div><div class="cmid"><b></b></div>`;
  add.querySelector('b').textContent = T('chats.add.row'); add.onclick = openImport; box.appendChild(add);
  if (!M.contacts.length){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = T('chats.empty'); box.appendChild(e); return; }
  for (const c of M.contacts){
    const b = document.createElement('button'); b.className = 'citem' + (c.id === M.currentId ? ' on' : '');
    const d = c.lastAt ? new Date(c.lastAt) : null;
    b.innerHTML = `<div class="av"></div><div class="cmid"><b></b><small></small></div><small class="t"></small>`;
    b.querySelector('.av').style.backgroundImage = c.avatar ? `url("${c.avatar}")` : '';
    b.querySelector('b').textContent = c.name; b.querySelector('.cmid small').textContent = c.last ? preview(c.last).split('\n').pop() : '';
    b.querySelector('.t').textContent = d ? stampText(d) : '';
    b.dataset.id = c.id;
    b.onclick = async () => {
      if (b.dataset.held) { delete b.dataset.held; return; }
      try { if (await M.openContact(c.id)) go('chat'); else toast(T('import.toast.notopened')); }
      catch(e){ toast(T('import.toast.notopened')); }
    };
    // a long press (or a right click) asks to delete him
    let held = null;
    b.addEventListener('pointerdown', () => { held = setTimeout(() => { b.dataset.held = '1'; deleteSheet(c); }, 600); });
    for (const t of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(t, () => clearTimeout(held));
    b.addEventListener('contextmenu', e => { e.preventDefault(); clearTimeout(held); deleteSheet(c); });
    box.appendChild(b);
  }
}

// 删除联系人: asked first. His in-browser folder goes with him; a folder on her computer stays there.
// o.first: the default companion, asked about once her own has moved in: 留着 is remembered, and she stays where she is
function deleteSheet(c, o = {}){
  const why = o.first ? 'import.first.text' : c.where === 'phone' ? 'chats.delete.text.phone' : c.where === 'folder' ? 'chats.delete.text.folder' : 'chats.delete.text.demo';
  // 删除 cannot be undone (data-danger: a tap of its own, never under the finger); the default char's question comes by
  // itself after a move, so it waits for an open sheet to close
  (o.first ? sheetLater : sheet)(`<h3></h3><p></p><button class="btn" id="delGo" data-danger>${esc(T('chats.delete'))}</button><button class="btn2" ${o.first ? 'id="delKeep"' : 'data-close'}>${esc(T(o.first ? 'import.first.keep' : 'cancel'))}</button>`, el => {
    el.querySelector('h3').textContent = T(o.first ? 'import.first.title' : 'chats.delete.title', { name: c.name });
    el.querySelector('p').textContent = T(why, { name: c.name });
    if (o.first) el.querySelector('#delKeep').onclick = async () => { closeSheet(); try { await M.firstCompanion({ keep: true }); } catch {} };
    el.querySelector('#delGo').onclick = async () => {
      closeSheet();
      try { await M.removeContact(c.id, { files:true }); D.forget(c.id); toast(T('chats.delete.done')); }
      catch(e){ toast(T('chats.delete.fail') + e.message); }
      if (!o.first) go('chats');
    };
  });
}

// ---------- 聊天 ----------
const STICKERS = { joy:'m-joy', sadness:'m-sadness', anger:'m-anger', surprise:'m-surprise', relief:'m-relief' };
// each of his moods is a standard phone emoji, not a drawn sticker (words.txt mood.<mood>.emoji; empty = none)
const moodEmoji = e => STICKERS[e] ? T('mood.' + e + '.emoji') : null;
function bubble(text, me){
  const d = document.createElement('div'); d.className = 'b ' + (me ? 'me' : 'ta');
  // c.ai and 酒馆 write actions between asterisks; show them quieter, without the asterisks
  for (const part of text.split(/(\*[^*]+\*)/)){
    if (!part) continue;
    if (/^\*[^*]+\*$/.test(part)) { const s = document.createElement('span'); s.className = 'act'; s.textContent = part.slice(1, -1); d.appendChild(s); }
    else d.appendChild(document.createTextNode(part));
  }
  return d;
}
// 美化 → 表情: 'line' (the line-drawn sticker), 'kaomoji' (颜文字 from kaomoji.txt), 'both'
function sticker(e){
  const id = STICKERS[e]; if (!id || look.sticker === 'kaomoji') return null;
  const em = moodEmoji(e); if (em === '') return null;
  // an emoji is shown at text size (.sticker.emo), not as a big tile; only a drawn sticker stays big
  const d = document.createElement('div'); d.className = em ? 'sticker emo' : 'sticker'; d.dataset.emotion = e;
  if (em) { const s = document.createElement('span'); s.className = 'emoji'; s.textContent = em; d.appendChild(s); }
  else d.innerHTML = `<svg class="ic"><use href="#${id}"/></svg>`;
  return d;
}
// every reply carries his mood (for the body and his face), but the chat shows it as a sticker (or
// kaomoji) only now and then: when his mood changed since his reply before, and with at least three replies of his
// between two stickers. Read in chat order (renderChat starts it again), so the same chat always shows the same ones.
let moodPrev = '', moodGap = 9;
function moodTurn(m){
  const e = m.extra && m.extra.modu_emotion; if (!e) return false;
  const show = !!STICKERS[e] && e !== moodPrev && moodGap >= 3;
  moodPrev = e; moodGap = show ? 0 : moodGap + 1;
  return show;
}
// his mood as a kaomoji under his bubbles (kaomoji.js; the same reply always gets the same one)
function kao(m){
  const e = m.extra && m.extra.modu_emotion;
  if (!STICKERS[e] || (look.sticker !== 'kaomoji' && look.sticker !== 'both') || !window.ModuKaomoji) return null;
  const t = window.ModuKaomoji.pick(e, `${m.send_date}|${m.mes}`); if (!t) return null;
  const d = document.createElement('div'); d.className = 'kao'; d.dataset.emotion = e; d.textContent = t; return d;
}
// 心声: what he thinks and does not say (extra.modu_inner), a quiet line under his reply,
// closed until she taps it. 聊天 ⋯ → 心声 switches it off (then it is not asked for either).
function inner(m){
  const t = m.extra && m.extra.modu_inner; if (!t || look.inner === 'off') return null;
  const d = document.createElement('button'); d.type = 'button'; d.className = 'inner';
  d.setAttribute('aria-expanded', 'false'); d.setAttribute('aria-label', T('chat.inner.tap'));
  d.innerHTML = `<span class="inner-k">${esc(T('chat.inner'))}</span><span class="inner-t"></span>`;
  d.onclick = () => { const open = d.getAttribute('aria-expanded') !== 'true'; d.setAttribute('aria-expanded', String(open)); d.querySelector('.inner-t').textContent = open ? t : ''; };
  return d;
}
// Chat cards: a message with extra.modu_card = { app, … } is drawn by that app.
// Its card(msg, ctx) gives { icon, title, sub, foot, done } (or a Promise of it); the page draws the card
// and redraws it when a record of the app's types changes; a tap calls its cardTap(msg, ctx). Without the
// app, or when card() gives nothing, the message is a plain bubble.
function cardApp(m){ const c = m && m.extra && m.extra.modu_card, a = c && typeof c.app === 'string' && A.get(c.app); return a && typeof a.card === 'function' ? a : null; }
function appCard(m){
  const a = cardApp(m); if (!a) return null;
  const d = document.createElement('button'); d.type = 'button'; d.className = 'appcard ' + (m.is_user ? 'me' : 'ta'); d.dataset.card = a.id; d.modu = m;
  d.onclick = () => { if (typeof a.cardTap === 'function') { try { a.cardTap(m, appCtx()); } catch(e){ console.error(e); } } };
  fillCard(d); return d;
}
async function fillCard(d){
  const a = A.get(d.dataset.card); let v = null;
  try { v = a && await a.card(d.modu, appCtx()); } catch(e){ console.error(e); }
  if (!v) { if (!d.childElementCount && d.parentNode) d.replaceWith(bubble(d.modu.mes, d.modu.is_user)); return; }
  d.innerHTML = `<i><svg class="ic"><use href="#${esc(v.icon || a.icon)}"/></svg></i><span class="ac-m"><b class="ac-t"></b><small class="ac-s"></small></span><small class="ac-f"></small>`;
  d.querySelector('.ac-t').textContent = v.title || ''; d.querySelector('.ac-s').textContent = v.sub || ''; d.querySelector('.ac-f').textContent = v.foot || '';
  d.classList.toggle('done', !!v.done);
}
// A neutral card (a 酒馆 system message with extra.modu_card.kind) is a grey line in the middle of the chat,
// not her bubble and not his: 'summary' (an app session's end) and 'invite' (his invitation)
function cardKind(m){ const c = m && m.is_system && m.extra && m.extra.modu_card; return c && (c.kind === 'summary' || c.kind === 'invite') ? c.kind : ''; }
function neutralCard(m){
  const k = cardKind(m); if (!k) return null;
  const d = document.createElement('div'); d.className = 'sysline cardline ' + k; d.dataset.kind = k;
  const c = m.extra.modu_card, a = c.app && A.get(c.app); if (a) d.dataset.app = a.id;
  d.textContent = m.mes;
  if (k === 'invite' && window.ModuScheduler) return ModuScheduler.inviteCard(d, m);   // 好啊 / 下次吧
  // an app with cardTap may open its card (通话's transcript): the line is then a button
  if (a && typeof a.cardTap === 'function'){
    d.classList.add('tap'); d.setAttribute('role', 'button'); d.tabIndex = 0;
    d.onclick = () => { try { const r = a.cardTap(m, appCtx()); if (r && r.catch) r.catch(e => console.error(e)); } catch(e){ console.error(e); } };
    d.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); d.click(); } };
  }
  return d;
}
let lastStampAt = 0;
function stamp(m, to = $('log')){
  const d = M.msgDate(m);
  if (d && (!lastStampAt || lastStampAt === -1 || d - lastStampAt > 5 * 60 * 1000)) { const s = document.createElement('div'); s.className = 'stamp'; s.textContent = stampText(d); to.appendChild(s); }
  // a message with no time (or only one that cannot be true) is marked once as 时间不详, never given a time
  if (!d && lastStampAt !== -1) { const s = document.createElement('div'); s.className = 'stamp'; s.textContent = T('chat.stamp.undated'); to.appendChild(s); }
  lastStampAt = d || -1;
}
// what he does is a quiet line in the chat with no bubble (美化 → 他的动作 off: not shown, not asked for)
function actLine(t){ const d = document.createElement('div'); d.className = 'actline'; d.textContent = t; return d; }
// a photo he sends (a tag in his words, core photoTags; his greeting too) is a bubble of its own, [照片] and what it
// shows, never the raw "[照片: …]" text. The tag is lifted out first, before the display regex (which breaks lines after a 。)
// and before the reply is cut into bubbles, so a 。 inside it cannot split it
const PHOTO_MARK = '\u0001';
function hisParts(m){
  const ph = M.photoTags ? M.photoTags(m.mes, `\n${PHOTO_MARK}\n`) : { text: m.mes, photos: [] };
  ph.text = shown(ph.text, 'him');
  let k = 0;
  return M.splitParts(ph.text, { name: S.name, pronoun: M.pronouns().zh, actions: look.actions !== 'off' })
    .map(p => p.text === PHOTO_MARK ? { kind: 'photo', text: ph.photos[k++] || '' } : p.text.includes(PHOTO_MARK) ? { kind: p.kind, text: p.text.split(PHOTO_MARK).join(T('chat.photo')) } : p);
}
function photoEl(cap){
  const d = bubble(T('chat.photo'), false); d.dataset.photo = '';
  if (cap) { const s = document.createElement('span'); s.className = 'act'; s.textContent = ' ' + cap; d.appendChild(s); }
  return d;
}
// display-side regex (the card's own, else Modu's default) changes only what the screen shows, as text;
// the stored chat stays as it is. Its markers are read here: the mood is already his sticker, an unknown marker is dropped
function shown(t, who){ if (!M.regex || !t) return t; const r = M.regex.markers(M.regex.display(t, { who })); return r.text || t; }
const partEl = p => p.kind === 'act' ? actLine(p.text) : p.kind === 'photo' ? photoEl(p.text) : bubble(p.text, false);
// His reply is shown as several short bubbles and action lines (core.js splitParts); history appears at once.
function addMsg(m, log = $('log')){
  stamp(m, log);
  const nc = neutralCard(m); if (nc) { log.appendChild(nc); return; }
  const card = appCard(m); if (card) { log.appendChild(card); return; }
  if (m.is_user) { log.appendChild(bubble(shown(m.mes, 'her'), true)); if (unsent(m)) log.appendChild(unsentLine()); const rm = window.ModuScheduler && ModuScheduler.readMark(m); if (rm) log.appendChild(rm); return; }
  for (const part of hisParts(m)) log.appendChild(partEl(part));
  const mood = moodTurn(m);
  const st = mood && sticker(m.extra.modu_emotion); if (st) log.appendChild(st);
  const k = mood && kao(m); if (k) log.appendChild(k);
  const n = inner(m); if (n) log.appendChild(n);
}
// A new reply arrives one bubble after another, with his typing between them.
let playing = Promise.resolve();
function playMsg(m){
  setReplyComing(true);
  playing = playing.then(async () => {
    const log = $('log'); stamp(m);
    const nc = neutralCard(m); if (nc) { nc.classList.add('pop'); log.appendChild(nc); log.scrollTop = 1e9; return; }
    const card = appCard(m); if (card) { card.classList.add('pop'); log.appendChild(card); log.scrollTop = 1e9; return; }
    const parts = hisParts(m), mood = moodTurn(m);
    for (let i = 0; i < parts.length; i++){
      if (i) { showTyping(true); await wait(Math.min(1500, 450 + parts[i].text.length * 35)); showTyping(false); }
      const b = partEl(parts[i]); b.classList.add('pop'); log.appendChild(b); log.scrollTop = 1e9;
    }
    const st = mood && sticker(m.extra.modu_emotion); if (st) { await wait(300); st.classList.add('pop'); log.appendChild(st); log.scrollTop = 1e9; }
    const k = mood && kao(m); if (k) { await wait(st ? 150 : 300); k.classList.add('pop'); log.appendChild(k); log.scrollTop = 1e9; }
    const n = inner(m); if (n) { await wait(400); n.classList.add('pop'); log.appendChild(n); log.scrollTop = 1e9; }
  }).finally(() => setReplyComing(false));
  return playing;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
// a long chat (a 20k-message import) is drawn as a window, the latest CHAT_WIN messages, and earlier
// ones in small batches (CHAT_MORE, one per task, so a slow phone never freezes for long) while she is within CHAT_NEAR of
// the top, her place kept. Stamps and stickers read the chat in order, so a window starts from the state a full draw would
// have had there, and looks the same. go('chat') starts at the latest window; a redraw (心声 switched, 已读 arriving) keeps
// what was drawn and where she was.
const CHAT_WIN = 100, CHAT_MORE = 25, CHAT_NEAR = 1500;
const chatWin = { msgs: null, start: 0, armed: false, mood: [], more: 0 };
// the sticker state before message i is read once per chat and kept (mood[i]), so a batch starts at no cost
function chatStateAt(i){

      const hits = list.map((m, i) => [m, i]).filter(([m]) => words.every(w => (m.id + ' ' + m.name).toLowerCase().includes(w)));
      const shown = hits.slice(0, 60);
      box.innerHTML = shown.map(([m, i]) => {
        const sub = [m.name !== m.id ? m.name : '', m.free ? T('model.fetch.free') : m.price ? `$${money(m.price.in)} / $${money(m.price.out)}` : ''].filter(Boolean).join(' · ');
        return `<button type="button" data-i="${i}" class="${m.id === cur ? 'on' : ''}"><span><span>${esc(m.id)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</span></button>`;
      }).join('') || `<div class="mnote">${esc(T('model.fetch.none'))}</div>`;
      count.textContent = hits.length > shown.length ? T('model.fetch.more', { n: hits.length, shown: shown.length }) : T('model.fetch.count', { n: hits.length });
      for (const b of box.querySelectorAll('[data-i]')) b.onclick = () => { closeSheet(); onPick(list[Number(b.dataset.i)]); };
    };
    q.oninput = draw; draw();
  });
}
// 拉取模型 for a setting s ({ endpoint, key, model }): val = the row's value span, why = the line under it
async function fetchModels(s, val, why, onPick){

function safeSheet(){

// 备份 (backup.js): export his folder as one .zip; import one back as a new contact
// an iPhone / iPad (Safari asks before a download, and she may say no): the toast says it is ready, not saved
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
// what she sees when a backup goes wrong is plain words: a known code has its own line, a sentence the core or
// backup.js wrote in Chinese stays, raw JS text never
function plainErr(e, pre){ const k = e && e.code ? pre + e.code : ''; return k && k in WORDS ? T(k) : e && /[\u4e00-\u9fff]/.test(e.message || '') ? e.message : T(pre + 'other'); }
let exporting = false, restoring = false;   // a second tap while the first is still working does nothing
$('exportBtn').onclick = async () => {
  if (exporting) return; exporting = true;

$('importBtn').onclick = () => { if (DEMO) { toast(T('settings.import.demo')); return; } $('importFile').click(); };
// the same backup restored again: she is asked (open him / one more / cancel). → 'open' | 'again' | null
function askSame(p){
  return new Promise(resolve => {
    const scrim = $('scrim'), out = e => { if (e.target === scrim || e.target.closest('[data-close]')) done(null); };
    const done = v => { scrim.removeEventListener('click', out); resolve(v); };
    scrim.addEventListener('click', out);
    sheet(`<h3></h3><p></p><button class="btn" id="sameOpen"></button><button class="btn2" id="sameAgain"></button><button class="btn2" data-close>${esc(T('cancel'))}</button>`, el => {
      el.querySelector('h3').textContent = T('settings.import.same.title', { name: p.same.name });
      el.querySelector('p').textContent = T('settings.import.same.text', { name: p.same.name });
      el.querySelector('#sameOpen').textContent = T('settings.import.same.open', { name: p.same.name });
      el.querySelector('#sameAgain').textContent = T('settings.import.same.again');
      el.querySelector('#sameOpen').onclick = () => { closeSheet(); done('open'); };
      el.querySelector('#sameAgain').onclick = () => { closeSheet(); done('again'); };
    });
  });
}
$('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || restoring) return;
  restoring = true;
  try {
    const p = await window.ModuBackup.peek(f, M);
    if (p.same){
      const a = await askSame(p);
      if (a === 'open'){ if (await M.openContact(p.same.id)) go('chat'); else toast(T('import.toast.notopened')); }
      if (a !== 'again') return;
    }
    let root;
    if (PICK) { toast(T('import.toast.pick')); root = await window.showDirectoryPicker({ mode:'readwrite', id:'modu' }); }
    else root = M.phoneRoot();
    const r = await window.ModuBackup.importCompanion(f, root, M);
    toast(T('settings.import.done', { name: r.name })); go('chat');
    if (!PICK) keepNotice({ persisted: r.persisted });   // 换手机: the same once-only line as after her own import
  } catch(err){ if (err.name !== 'AbortError') toast(T('settings.import.fail') + plainErr(err, 'settings.import.err.')); }
  finally { restoring = false; }
};
// after she moves her own companion into this phone the core asks the browser to keep him
// ('storage'). Not kept: said once. On an iPhone not opened from the home screen, Safari clears a site after 7 days
// without a visit, and private browsing loses him when the tab closes. A home-screen web app has its own storage, so the
// way to keep him is a backup carried over: 导出备份 here, then import it in the home-screen 小手机; elsewhere, a backup.
M.on((ev, d) => { if (ev === 'storage') keepNotice(d); });
// the sheet waits for an open one (the default char's question) to close; it counts as seen only when
// one of its own buttons is tapped (a stray tap on the backdrop does not); and with localStorage blocked (an in-app browser,
// old private mode) it is said once per visit
const keepTold = new Set();
let keepWaiting = '';
function keepNotice(d){
  if (!d || d.persisted !== false) return;
  const k = IOS && !STANDALONE ? 'keep.ios' : 'keep.other', seen = 'modu-keep-told';
  if (keepTold.has(k) || keepWaiting === k) return;
  try { if (localStorage.getItem(seen) === k) return; } catch {}
  const told = () => { keepTold.add(k); try { localStorage.setItem(seen, k); } catch {} };
  keepWaiting = k;
  setTimeout(() => {
    const name = S.name || T('about.him');
    if (k === 'keep.other') { keepWaiting = ''; told(); toast(T('keep.other', { name })); return; }
    sheetLater(`<h3></h3><p></p><button class="btn" id="keepExport">${esc(T('settings.export'))}</button><button class="btn2" id="keepOk">${esc(T('ok'))}</button>`, el => {
      keepWaiting = '';
      el.querySelector('h3').textContent = T('keep.ios.title', { name }); el.querySelector('p').textContent = T('keep.ios.text', { name });
      el.querySelector('#keepExport').onclick = () => { told(); closeSheet(); $('exportBtn').click(); };
      el.querySelector('#keepOk').onclick = () => { told(); closeSheet(); };
    });
  }, 900);
}
// 放到手机桌面: the steps for the phone she is on. iPhone: Safari's 添加到主屏幕. Android in Chrome: its
// 添加到主屏幕 / 安装应用 (the manifest makes it an app with no address bar). Anywhere else (Huawei's own app, QQ, WeChat,
// which may only make a bookmark that opens with its bars): open it in Chrome. HarmonyOS NEXT (no Android, no Chrome):
// Huawei's own app is the only way, its own steps. Not shown on a computer, nor once she opened 小手机 from the home screen.
const UA = navigator.userAgent, HARMONY = /OpenHarmony/i.test(UA) && !/Android/i.test(UA), ANDROID = /Android/i.test(UA);
const CHROME = ANDROID && /Chrome\//.test(UA) && !/HuaweiBrowser|HONORBrowser|HarmonyOS|MiuiBrowser|HeyTapBrowser|VivoBrowser|SamsungBrowser|UCBrowser|QQBrowser|Quark|EdgA|OPR\/|\bQQ\/|MicroMessenger|; wv\)/.test(UA);
$('installBtn').hidden = STANDALONE || !(IOS || ANDROID || HARMONY);
$('installBtn').onclick = () => {

// 版本: seven taps turn the developer switch on or off (like a phone's 关于手机 → 版本号)
let devTaps = 0, devTapT = 0;
$('versionRow').onclick = () => {

// the bridge, shown in 设置 → 高级 and in 身体 → 关联设备 (StackChan is one of its drivers)

  const t = b.status === 'off' ? '' : T('settings.bridge.' + b.status);

  $('vBridge').textContent = t + (b.status === 'on' && b.drivers.length ? ' · ' + b.drivers.join('、') : '');

  $('scChip').textContent = T(sc ? 'dev.on' : b.status === 'on' ? 'dev.bridge.only' : 'dev.off');

function askBridge(url){

// ---------- start ----------
applyLook();
L.applyUserCSS();
fitViewport();
// No service worker (one left Safari on an iPhone blank; the manifest alone makes the phone app). One left
// from an older version on this phone is taken away (sw.js removes itself too).
if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
// 开屏: once per visit (this tab), gone within 1.2 s, a tap skips it; the phone boots underneath.
// Never in screenshots (?shot=1) unless ?splash=1, which keeps it on screen to be photographed.
(function splash(){
  const el = $('splash'), shot = qs.has('shot'), force = qs.get('splash') === '1';
  let seen = false; try { seen = sessionStorage.getItem('modu-splash') === '1'; sessionStorage.setItem('modu-splash', '1'); } catch {}
  if (!force && (shot || seen)) { el.remove(); return; }
  el.hidden = false;
  const gone = () => el.remove();
  el.onclick = () => { el.classList.add('out'); setTimeout(gone, 420); };
  if (shot) return;
  // on screen about 0.7 s, less if the page was slow to start, so it is gone by about 1.1 s after the page began
  const hold = Math.max(150, Math.min(700, 700 - performance.now()));
  el.style.setProperty('--splash-hold', hold + 'ms'); el.classList.add('run');
  el.addEventListener('animationend', e => { if (e.animationName === 'splash-out') gone(); });
  setTimeout(gone, hold + 600);   // and if animationend never comes, it still goes
})();
if (settings.bridge) M.bridgeConnect(settings.bridge);
if (qs.get('presence')) M.setPresence(qs.get('presence'));   // for trying the lock screen
// For screenshots: ?page=2 opens the home screen's second page, ?tab=devices the 身体 devices tab,
// ?tap=<selector> taps one thing (a sheet, a choice) after the screen opens, ?scroll=<selector> scrolls it into view.
function openAt(){
  if (SAFE) setTimeout(safeSheet, 400);
  if (qs.get('page') === '2') requestAnimationFrame(() => { $('pages').scrollLeft = $('pages').clientWidth; });
  if (qs.get('tab')) { const t = document.querySelector(`[data-tab="${qs.get('tab')}"]`); if (t) t.click(); }
  if (qs.get('scroll')) setTimeout(() => { const t = document.querySelector(qs.get('scroll')); if (t) t.scrollIntoView({ block:'center' }); }, 200);
  if (qs.get('tap')) setTimeout(() => { const t = document.querySelector(qs.get('tap')); if (t) t.click(); }, 300);
}
(async () => {
  await Promise.all([loadWords(), A.ready, window.ModuKaomoji ? window.ModuKaomoji.load() : null]); applyWords(); applyDev(); holdBeta(); renderPage2(); watchApps(); tick(); if (window.ModuScheduler) ModuScheduler.init({ T, toast, go, sheet, choose, esc, $, settings: () => settings, persist, current: () => current, name: () => S.name, redrawChat: () => { if (current === 'chat') renderChat(); } }); showStaged(); renderBridge({ status:'off', drivers:[] });
  if (bridgeAsk) askBridge(bridgeAsk);
  if (DEMO){
    // ?demo=1: the default companion char with a sample chat (samples/char_zh*); ?demo=en: char in English; anything else: char
    const who = { en:'char_en' }[qs.get('demo')] || 'char_zh';
    try { staged = await M.loadDemo('../samples/', who); showStaged(); }
    catch(e){ note(T('import.demo.fail'), true); }
    const want = location.hash.slice(1);
    if (qs.has('go') || (want && want !== 'import')) { await M.loadStaged(staged); staged = null; go(qs.get('go') || want); openAt(); return; }
    go('import'); openAt(); return;
  }
  // Everyone she has brought home is in this browser's contacts. A fresh install (no companion ever)
  // first gets the default companion char (samples/char_zh.png; char_en.png with ?lang=en; core firstRun). Then it opens like a phone: the lock
  // screen, then home (or the screen she was on). The last companion is opened if the browser allows it
  // without asking; otherwise 聊天 lists them (one tap lets the browser ask).
  await M.loadContacts();
  await M.firstRun('../samples/', { lang: qs.get('lang') === 'en' ? 'en' : 'zh' });
  const last = M.current() || M.contacts[0];
  let opened = false;
  // a folder that will not open is said in plain words (the core's sentence), never a blank phone
  if (last && await M.canOpenWithoutAsking(last)) { try { opened = await M.openContact(last.id); } catch(e){ toast(T('boot.open.fail', { name: last.name, why: /[\u4e00-\u9fff]/.test(e && e.message || '') ? e.message : T('import.toast.notopened') })); } }
  const want = location.hash.slice(1);
  lockTarget = !opened && M.contacts.length ? 'chats' : want && want !== 'lock' && want !== 'import' ? want : 'home';
  if (!want || want === 'lock' || needCode()) go('lock'); else unlock();
  openAt();
})();
})();
