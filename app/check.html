filesDone = function(){ filesDone = null; cardFile(function(){ workers(function(){ state.textContent = '检查完了。点上面的「复制全部」，把文字发给我们。'; row('结束', '检查完了', new Date().toTimeString().slice(0, 8)); }); }); };
pump();

// 复制全部
document.getElementById('copy').onclick = function(){
  var btn = this, text = raw.textContent;
  function done(){ btn.textContent = '复制好了'; }
  function fallback(){ try { var r = document.createRange(); r.selectNodeContents(raw); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); if (document.execCommand('copy')) done(); else btn.textContent = '请长按下面的文字复制'; } catch (e) { btn.textContent = '请长按下面的文字复制'; } }
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); return; } } catch (e) {}
  fallback();
};

// 在下面打开小手机：the real page in a frame on this origin; after a while, what its own safe.js kept (ModuSafe.errors),
// whether the phone showed (.phone.ready), and what index.html's own line says (ModuBootFailed)
document.getElementById('boot').onclick = function(){
  var btn = this, S = '小手机在这一页里打开的结果'; btn.disabled = true;
  document.getElementById('frameBox').hidden = false;
  var f = document.getElementById('frame'), t = Date.now(), readyAt = 0;
  f.src = 'index.html#home';
  var tick = setInterval(function(){
    var W, D, phone, ready, errs, failed, note;
    try { W = f.contentWindow; D = f.contentDocument; } catch (e) { row(S, '看不进去', String(e), 'no'); clearInterval(tick); return; }
    if (!D) return;
    phone = D.getElementById('phone'); ready = phone && /\bready\b/.test(phone.className);
    errs = W.ModuSafe && W.ModuSafe.errors ? W.ModuSafe.errors : null; failed = W.ModuBootFailed; note = D.getElementById('bootStuck') || D.getElementById('bootFail');
    var s = Math.round((Date.now() - t) / 1000);
    if (ready) {
      // then: did the first start put char in 聊天 (ModuCore.contacts)? firstRun runs after the phone shows, so wait up to 15 s
      var cs = W.ModuCore && W.ModuCore.contacts, n = cs ? cs.length : -1;
      if (!readyAt) { readyAt = s; row(S, s + ' s', '小手机打开了（.phone.ready）' + (errs && errs.length ? '，但有报错：' + errs.join(' | ') : ''), errs && errs.length ? 'warn' : 'ok'); }
      if (n > 0 || s - readyAt >= 15) { row(S, '聊天里', n < 0 ? '看不到名单（ModuCore.contacts 不在）' : n > 0 ? n + ' 个人（' + cs.map(function(c){ return c.name; }).join('、') + '）' : '没有人：第一次放进 char 失败了（看上面 Array.at 和 Chrome 内核版本）', n > 0 ? 'ok' : 'no'); clearInterval(tick); }
      return;
    }
    if (failed) { row(S, s + ' s', '没有到齐的文件：' + failed.join(', '), 'no'); clearInterval(tick); return; }
    if (errs && errs.length) { row(S, s + ' s', '报错：' + errs.join(' | '), 'no'); clearInterval(tick); return; }
    if (s >= 30) { row(S, s + ' s', '没打开，也没有报错 · readyState ' + D.readyState + ' · ModuSafe ' + (W.ModuSafe ? '在' : '不在') + ' · ModuCore ' + (W.ModuCore ? '在' : '不在') + ' · ModuApps ' + (W.ModuApps ? '在' : '不在') + (note ? ' · 页面自己的提示：' + note.textContent.slice(0, 200) : ''), 'no'); clearInterval(tick); }
  }, 1000);
};

// 清掉：every service worker registration and cache on this origin, then the list again
document.getElementById('clean').onclick = function(){
  var btn = this, S = '清理'; btn.disabled = true;
  var p = Promise.resolve();
  if ('serviceWorker' in navigator) p = p.then(function(){ return navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })).then(function(xs){ row(S, '去掉的后台程序', xs.length, 'ok'); }); }); });
  if (window.caches && caches.keys) p = p.then(function(){ return caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches['delete'](k); })).then(function(){ row(S, '清掉的缓存', ks.length, 'ok'); }); }); });
  p.then(function(){ row(S, '清好了', '再从桌面图标或地址打开一次小手机', 'ok'); }, function(e){ row(S, '清不了', String(e), 'no'); });
};
})();
